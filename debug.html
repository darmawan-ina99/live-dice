<!DOCTYPE html><html><head><meta charset="utf-8"><title>dbg</title></head><body>
<pre id="r">running...</pre>
<script>
var VS_D="attribute vec3 aPos;attribute vec3 aNormal;attribute vec2 aUV;attribute float aFace;"+
"uniform mat4 uMVP;uniform mat4 uModel;"+
"varying vec3 vWorldPos;varying vec3 vWorldN;varying vec3 vLocalPos;varying vec2 vUV;varying float vFace;"+
"void main(){vec4 wp=uModel*vec4(aPos,1.0);vWorldPos=wp.xyz;vWorldN=(uModel*vec4(aNormal,0.0)).xyz;"+
"vLocalPos=aPos;vUV=aUV;vFace=aFace;gl_Position=uMVP*vec4(aPos,1.0);}";
var FS_D="precision highp float;"+
"uniform vec3 uCam;uniform vec3 uLightA;uniform vec3 uLightB;"+
"uniform sampler2D uTex;uniform sampler2D uTex2;uniform float uSym;"+
"varying vec3 vWorldPos;varying vec3 vWorldN;varying vec3 vLocalPos;varying vec2 vUV;varying float vFace;"+
"float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }"+
"void main(){"+
"  vec3 N = normalize(vWorldN);\n"+
"  vec3 V = normalize(uCam - vWorldPos);\n"+
"  vec3 a = abs(vLocalPos);\n"+
"  float edge = max(max(min(a.x,a.y), min(a.y,a.z)), min(a.x,a.z));\n"+
"  float bevel = smoothstep(0.30, 0.50, edge) * 0.40;\n"+
"  float idx = floor(vFace + 0.5);\n"+
"  float col = mod(idx, 3.0);\n"+
"  float row = floor(idx / 3.0);\n"+
"  vec2 uv = (vUV - 0.5) * 1.18 + 0.5;\n"+
"  float inside = step(0.0, uv.x) * step(uv.x, 1.0) * step(0.0, uv.y) * step(uv.y, 1.0);\n"+
"  vec2 auv = (vec2(col, row) + clamp(uv, 0.001, 0.999)) / vec2(3.0, 2.0);\n"+
"  vec4 an = (uSym > 0.5) ? texture2D(uTex2, auv) : texture2D(uTex, auv);\n"+
"  float am = an.a * inside;\n"+
"  float gl_ = hash(floor(vLocalPos * 40.0)) * 0.02;\n"+
"  vec3 ivory = vec3(0.95, 0.91, 0.82) + gl_;\n"+
"  vec3 base = mix(ivory, an.rgb, am);\n"+
"  base *= mix(1.0, 0.80, bevel);\n"+
"  vec3 L1 = normalize(uLightA - vWorldPos);\n"+
"  vec3 L2 = normalize(uLightB - vWorldPos);\n"+
"  float d1 = max(dot(N, L1), 0.0);\n"+
"  float d2 = max(dot(N, L2), 0.0);\n"+
"  vec3 H1 = normalize(L1 + V);\n"+
"  vec3 H2 = normalize(L2 + V);\n"+
"  float shininess = mix(90.0, 30.0, am);\n"+
"  float s1 = pow(max(dot(N, H1), 0.0), shininess);\n"+
"  float s2 = pow(max(dot(N, H2), 0.0), shininess * 0.6);\n"+
"  float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);\n"+
"  vec3 refl = reflect(-V, N);\n"+
"  vec3 env = mix(vec3(0.20,0.04,0.05), vec3(1.0,0.90,0.85), smoothstep(-0.4, 0.9, refl.y));\n"+
"  float glaze = 0.55 + 0.45 * (1.0 - am);\n"+
"  vec3 c = base * (0.30 + 0.80 * d1 + 0.32 * d2);\n"+
"  c += vec3(1.0, 0.96, 0.9) * (s1 * 0.75 + s2 * 0.35) * glaze;\n"+
"  c += env * fres * 0.40 * glaze;\n"+
"  c = pow(c, vec3(0.95));\n"+
"  gl_FragColor = vec4(c, 1.0);\n}";
var c=document.createElement('canvas');
var gl=c.getContext('webgl');
function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
  var ok=gl.getShaderParameter(s,gl.COMPILE_STATUS);
  return {ok:ok, log:gl.getShaderInfoLog(s)||'(tanpa log)'};}
var rv=document.getElementById('r');
var v=sh(gl.VERTEX_SHADER,VS_D);
var f=sh(gl.FRAGMENT_SHADER,FS_D);
rv.textContent = 'VS ok: '+v.ok+'\nVS log: '+v.log+'\nFS ok: '+f.ok+'\nFS log: '+f.log;
</script></body></html>
